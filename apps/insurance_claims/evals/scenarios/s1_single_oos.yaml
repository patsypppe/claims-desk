id: s1_single_oos
category: scope
description: A single irrelevant question is redirected; captured data is kept.
oracle_factors: {name: Margaret Chen}
expected_outcome: {escalated: false}
turns:
  - user: "Hi, I'm Margaret Chen."
    expect: {state: {phase: VERIFY_ID}}
