id: p4_email_failure
category: post_process
email_fails: true
description: Email provider fails; never claims it was sent; retry once then close.
oracle_factors: {name: Margaret Chen, dob: "1985-03-15", id_last4: "4472"}
expected_outcome: {terminal: COMPLETE, case_id: CL-2048, escalated: false}
turns:
  - user: "Margaret Chen, born March 15 1985, SSN ends in 4472. It's about my denied healthcare claim."
    expect: {state: {selected_case_id: CL-2048}}
  - user: "No, that's everything."
    expect: {state: {phase: POST_PROCESS, consent: OFFERED}, tools_not_called: [send_summary_email]}
  - user: "Yes please."
    expect: {state: {consent: FAILED, phase: POST_PROCESS}, text: {must_reference: ["couldn't be sent"], must_not_reference: ["emailed the summary"]}}
  - user: "Yes, try again."
    expect: {state: {phase: COMPLETE}, text: {must_not_reference: ["emailed the summary"]}}
