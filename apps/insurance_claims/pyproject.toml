[project]
name = "claims-agent"
version = "0.1.0"
description = "SOP-controlled conversational insurance claims support agent"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "groq>=0.30",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "rapidfuzz>=3.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claims_agent*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a real Anthropic API key"]
addopts = "-q"
