services:
  claims-agent:
    build: ./apps/insurance_claims
    image: claims-desk:latest
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE: sqlite
      SQLITE_PATH: /data/claims_agent.db
    volumes:
      - claims-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  claims-data:
